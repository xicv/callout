[project]
name = "callout"
version = "0.1.0"
description = "Text-to-speech plugin for Claude Code"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "mistune>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
